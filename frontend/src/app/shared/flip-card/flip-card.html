<button
  type="button"
  (click)="toggle()"
  class="flex flex-col items-center w-full perspective-[1000px] hover:cursor-pointer"
>
  <div
    class="relative w-full max-w-2xl h-80 mx-4 transform-3d transition-transform duration-500 rounded-3xl hover:shadow-[2px_2px_10px] hover:shadow-amber-50"
    [class.rotate-y-180]="isFlipped()"
  >
    <section
      class="absolute inset-0 w-full h-full p-12 border-2 border-green-500 rounded-3xl bg-linear-to-t from-amber-50 to-green-50 flex flex-col justify-center gap-4 backface-hidden"
    >
      <h3 class="text-4xl font-extrabold text-center"><ng-content select="[card-face]" /></h3>
    </section>

    <section
      class="absolute inset-0 w-full h-full p-12 border-2 border-green-500 rounded-3xl bg-linear-to-t from-amber-50 to-green-50 flex flex-col justify-center gap-4 backface-hidden rotate-y-180"
    >
      <article class="font-bold text-center flex flex-col gap-4 text-lg">
        <ng-content select="[card-back]" />
      </article>
    </section>
  </div>
</button>
