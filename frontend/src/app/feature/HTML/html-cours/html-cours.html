<div class="pt-8 w-full flex flex-col items-center">
  <h2
    class="mb-8 pt-12 text-green-500 text-shadow-green-300 text-shadow-[0px_0px_16px] text-6xl text-center"
  >
    L'apprentissage
  </h2>

  <ul
    class="flex flex-col md:flex-row justify-around gap-4 bg-linear-to-b from-black to-20% to-amber-50 py-8 w-full"
  >
    <app-li-component (select)="toggle(0)"> L'initialisation du projet </app-li-component>
    <app-li-component (select)="toggle(1)"> Les premières balises indispensables </app-li-component>
    <app-li-component (select)="toggle(2)"> Pour aller plus loin </app-li-component>
    <app-li-component (select)="toggle(2)"> Exercices</app-li-component>
  </ul>

  <div>
    @if (indexPage() === 0) {
      <app-init-page />
    }
    @if (indexPage() === 1) {
      <app-first-balise-page />
    }

    @if (indexPage() === 2) {
      <app-more-html />
    }
    @if (indexPage() === 3) {
      <app-html-exercices />
    }
  </div>
</div>
