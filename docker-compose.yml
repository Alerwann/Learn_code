# @format
services:
  mysql:
    image: mysql:8.4
    container_name: codelearn_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '${MYSQL_PORT}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-p${MYSQL_ROOT_PASSWORD}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codelearn_net

  mongodb:
    image: mongo:8.0
    container_name: codelearn_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - '${MONGO_PORT}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codelearn_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codelearn_backend
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MONGO_HOST: mongodb
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - codelearn_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codelearn_frontend
    ports:
      - '4200:4200'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npx ng serve --host 0.0.0.0 --poll 2000
    depends_on:
      - backend
    networks:
      - codelearn_net

volumes:
  mysql_data:
  mongo_data:

networks:
  codelearn_net:
    driver: bridge
